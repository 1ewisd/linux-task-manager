[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-task-manager"
version = "1.0.0"
description = "A Windows-style Task Manager for Linux: processes, performance graphs, users, details and services."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
taskmgr = "taskmgr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskmgr = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
